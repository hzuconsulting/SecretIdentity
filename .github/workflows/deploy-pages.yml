# Déploiement sur GitHub Pages.
#
# Le site est **entièrement statique** : il n'y a rien d'autre à déployer.
# Le moteur de jeu tourne dans le navigateur du joueur qui crée la partie, et
# les téléphones se parlent ensuite directement en WebRTC.
#
# Réglage à faire une fois, dans le dépôt :
#   Settings → Pages → Source : « GitHub Actions »
#
# Aucune variable n'est obligatoire. Deux sont possibles, pour reprendre la main
# sur la mise en relation (Settings → Secrets and variables → Actions → Variables) :
#   PEER_HOST / PEER_PORT / PEER_PATH / PEER_KEY  → un PeerServer à soi
#   ICE_SERVERS                                   → un relais TURN, en JSON
# Voir la section « Réseau » du README.

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site statique
        working-directory: apps/web
        env:
          NEXT_OUTPUT: export
          NEXT_TELEMETRY_DISABLED: '1'
          # Le site vit dans un sous-dossier au nom du dépôt.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Optionnelles : vides, on utilise le courtier public de PeerJS et des
          # STUN publics. Elles sont inlinées au build — les changer impose de
          # relancer ce workflow.
          NEXT_PUBLIC_PEER_HOST: ${{ vars.PEER_HOST }}
          NEXT_PUBLIC_PEER_PORT: ${{ vars.PEER_PORT }}
          NEXT_PUBLIC_PEER_PATH: ${{ vars.PEER_PATH }}
          NEXT_PUBLIC_PEER_KEY: ${{ vars.PEER_KEY }}
          NEXT_PUBLIC_ICE_SERVERS: ${{ vars.ICE_SERVERS }}
        run: npx next build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
