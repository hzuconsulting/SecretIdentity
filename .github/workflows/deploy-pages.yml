# Déploiement du client sur GitHub Pages.
#
# ⚠ Ce workflow ne déploie **que l'interface**. Le serveur temps réel a besoin
# d'un processus persistant : GitHub Pages ne sert que des fichiers. Il doit
# tourner ailleurs (Railway, Fly, Render), en HTTPS, et son URL doit être
# renseignée dans la variable de dépôt `SERVER_URL`.
#
# Réglages à faire une fois, dans le dépôt :
#   Settings → Pages → Source : « GitHub Actions »
#   Settings → Secrets and variables → Actions → Variables :
#     SERVER_URL = https://mon-serveur.up.railway.app

name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  # Permet de relancer un déploiement à la main, par exemple après avoir changé
  # l'URL du serveur.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on ne coupe pas celui qui est en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Construire le site statique
        working-directory: apps/web
        env:
          NEXT_OUTPUT: export
          NEXT_TELEMETRY_DISABLED: '1'
          # Le site vit dans un sous-dossier au nom du dépôt.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # Inlinée au build : changer cette variable impose de relancer le
          # workflow, un simple redémarrage du serveur ne suffit pas.
          NEXT_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          if [ -z "$NEXT_PUBLIC_SERVER_URL" ]; then
            echo "::error::La variable de dépôt SERVER_URL est vide. Sans elle, le client tentera de joindre localhost depuis le téléphone des joueurs."
            exit 1
          fi
          npx next build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
